name: Build and Run FraudEngine Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore CapitecFraudEngine.sln # Replace with your actual .sln filename if different

    - name: Build Solution
      run: dotnet build CapitecFraudEngine.sln --no-restore --configuration Release

    - name: Run xUnit Tests
      run: dotnet test CapitecFraudEngine.sln --no-build --configuration Release --verbosity normal