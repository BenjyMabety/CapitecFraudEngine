name: Build and Run FraudEngine Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Main Repository
      uses: actions/checkout@v4

    - name: Checkout Test Repository
      uses: actions/checkout@v4
      with:
        repository: 'BenjyMabety/FraudEngine.Tests'
        ref: 'master'
        path: 'FraudEngine.Tests'

    - name: Fix Test Project Path
      run: |
        if [ -f "FraudEngine.Tests/FraudEngine.Tests/FraudEngine.Tests.csproj" ]; then
          rsync -a FraudEngine.Tests/FraudEngine.Tests/ FraudEngine.Tests/
          rm -rf FraudEngine.Tests/FraudEngine.Tests
        fi

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore CapitecFraudEngine.sln

    - name: Build Solution
      run: dotnet build CapitecFraudEngine.sln --no-restore --configuration Release

    - name: Run xUnit Tests
      run: dotnet test CapitecFraudEngine.sln --no-build --configuration Release --verbosity normal